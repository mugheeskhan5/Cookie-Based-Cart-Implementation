{% extends 'base.html' %}

{% block content %}
<div class="cart-header">
    <h1 class="page-title">Your Activity Log</h1>
</div>
<p class="page-subtitle">Showing your last 50 actions.</p>

<div class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Action</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td class="log-time">{{ log.timestamp }}</td>
                <td class="log-action">{{ log.action }}</td>
                <td>{{ log.details if log.details else '-' }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align: center; padding: 2rem;">No activity logged yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
